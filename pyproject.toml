[project]
name = "db-connection"
version = "0.1.0"
description = "A professional PostgreSQL CLI tool with .env support, query file loading, and JSON/CSV parameter injection."
authors = [
  {name = "db_connection CLI"}
]
readme = "README.md"
requires-python = ">=3.11"

[project.dependencies]
dotenv = "^1.0"
"psycopg[binary]" = "^3.0"
rich = "^13.0"
typer = "^0.10"

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[project.scripts]
db_connection = "db_connection.cli:app"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
